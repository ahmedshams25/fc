<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>استوديو الميديا — صوت وفيديو</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f0ec;--bar:#fff;--ink:#16181d;--mute:#6a6f7a;--line:#dcd8d0;--a:#ff6a4d}
@media (prefers-color-scheme:dark){:root{--bg:#101318;--bar:#181c23;--ink:#eceef2;--mute:#8f96a3;--line:#2a303a}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 "IBM Plex Sans Arabic",system-ui,sans-serif;display:flex;flex-direction:column}
nav{display:flex;align-items:center;gap:6px;padding:8px 14px;background:var(--bar);border-bottom:1px solid var(--line);flex-wrap:wrap}
nav b{font-size:18px;margin-inline-end:14px}
nav button{font:inherit;color:var(--mute);background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;cursor:pointer;border-radius:8px 8px 0 0}
nav button:hover{color:var(--ink)}
nav button[aria-selected=true]{color:var(--ink);font-weight:700;border-bottom-color:var(--a)}
nav button:focus-visible{outline:2px solid var(--a);outline-offset:2px}
main{flex:1;min-height:0;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}
iframe[hidden]{display:none}
</style>
</head>
<body>
<nav role="tablist">
  <b>استوديو الميديا</b>
  <button role="tab" id="t-a" aria-selected="true" data-k="a">🎵 الصوت — قص ودمج وتحويل</button>
  <button role="tab" id="t-v" aria-selected="false" data-k="v">🎬 الفيديو — مونتاج وتايم لاين</button>
</nav>
<main>
  <iframe id="f-a" title="استوديو الصوت"></iframe>
  <iframe id="f-v" title="استوديو الفيديو" hidden></iframe>
</main>
<script type="text/plain" id="tpl-a"><!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>استوديو الصوت — قص ودمج وتحويل</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"><\/script>
<style>
:root{--bg:#f2f0ec;--panel:#fff;--ink:#16181d;--mute:#6a6f7a;--line:#dcd8d0;--wave:#2b6f77;--sel:rgba(226,86,58,.18);--cut:#e2563a;--ok:#1d7a4f;--r:14px}
@media (prefers-color-scheme:dark){:root{--bg:#101318;--panel:#181c23;--ink:#eceef2;--mute:#8f96a3;--line:#2a303a;--wave:#6fc3cc;--sel:rgba(255,120,90,.22);--cut:#ff7a5a;--ok:#5ad19a}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.6 "IBM Plex Sans Arabic",system-ui,sans-serif;padding:24px 16px 80px}
main{max-width:860px;margin:0 auto}
h1{font-size:28px;margin:0 0 4px;font-weight:700}
.sub{color:var(--mute);margin:0 0 22px}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;cursor:pointer;background:var(--panel);transition:border-color .15s,background .15s}
.drop.on,.drop:hover{border-color:var(--cut)}
.drop b{display:block;font-size:17px}
.drop span{color:var(--mute);font-size:13px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 14px}
button:hover{border-color:var(--mute)}
button:focus-visible,select:focus-visible,input:focus-visible,.drop:focus-visible{outline:2px solid var(--cut);outline-offset:2px}
button.pri{background:var(--cut);border-color:var(--cut);color:#fff;font-weight:700;padding:10px 22px}
button:disabled{opacity:.5;cursor:default}
#list{display:grid;gap:12px;margin:18px 0}
.clip{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.top{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.name{flex:1;min-width:140px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.idx{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:700}
.ib{padding:4px 10px}
canvas{display:block;width:100%;height:92px;border-radius:8px;background:var(--bg);touch-action:none;cursor:col-resize;direction:ltr}
.meta{display:flex;gap:14px;align-items:center;margin-top:10px;flex-wrap:wrap;color:var(--mute);font-size:13px}
.meta b{color:var(--ink);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.meta .sp{flex:1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
select,input[type=text],input[type=number]{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--ink)}
.chk{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:14px;display:none}
.bar i{display:block;height:100%;width:0;background:var(--cut);transition:width .1s}
#res{margin-top:16px;display:none}
#res audio{width:100%;margin:8px 0}
#res a{display:inline-block;background:var(--ok);color:#fff;text-decoration:none;padding:9px 20px;border-radius:10px;font-weight:700}
.msg{color:var(--cut);margin:10px 0 0;min-height:1em;font-size:14px}
.empty{color:var(--mute);text-align:center;padding:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>استوديو الصوت</h1>
  <p class="sub">قص أي مقطع، رتّب المقاطع، ادمجها في ملف واحد، وصدّره MP3 أو WAV. كل المعالجة تتم داخل متصفحك.</p>

  <div class="drop" id="drop" tabindex="0" role="button">
    <b>اسحب الملفات هنا أو اضغط للاختيار</b>
    <span>MP3 · WAV · OGG · M4A · AAC · FLAC · WEBM · وصوت الفيديو (حسب ما يدعمه المتصفح)</span>
    <input type="file" id="file" accept="audio/*,video/*" multiple hidden>
  </div>
  <p class="msg" id="err"></p>

  <section id="list"></section>

  <section class="panel" id="out">
    <div class="grid">
      <label>صيغة الإخراج
        <select id="fmt"><option value="mp3">MP3</option><option value="wav">WAV (بدون ضغط)</option></select>
      </label>
      <label>جودة MP3
        <select id="kbps"><option>128</option><option selected>192</option><option>256</option><option>320</option></select>
      </label>
      <label>معدل العينة
        <select id="sr"><option value="44100" selected>44.1 kHz</option><option value="48000">48 kHz</option><option value="22050">22.05 kHz</option></select>
      </label>
      <label>القنوات
        <select id="ch"><option value="2" selected>ستيريو</option><option value="1">مونو</option></select>
      </label>
      <label>فاصل صمت بين المقاطع (ثانية)
        <input type="number" id="gap" min="0" max="10" step="0.1" value="0">
      </label>
      <label>اسم الملف
        <input type="text" id="fname" value="merged" dir="ltr">
      </label>
    </div>
    <label class="chk"><input type="checkbox" id="fade" checked> تنعيم حواف كل مقطع (50 ملي ثانية) لمنع طقطقة القص</label>
    <div style="margin-top:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <button class="pri" id="go" disabled>دمج وتصدير</button>
      <span id="tot" style="color:var(--mute)"></span>
    </div>
    <div class="bar" id="bar"><i id="fill"></i></div>
    <div id="res"><b>تم التصدير</b><audio controls id="pl"></audio><a id="dl">تحميل الملف</a></div>
  </section>
</main>

<script>
const $=s=>document.querySelector(s);
let actx,clips=[],uid=0,cur=null,raf=0;
const AC=()=>actx||(actx=new (window.AudioContext||window.webkitAudioContext)());
const fmt=t=>{t=Math.max(0,t);const m=Math.floor(t/60),s=(t%60).toFixed(2).padStart(5,'0');return m+':'+s};
const err=m=>$('#err').textContent=m||'';

/* ---------- إضافة الملفات ---------- */
const drop=$('#drop'),fileIn=$('#file');
drop.onclick=()=>fileIn.click();
drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fileIn.click()}};
fileIn.onchange=()=>{add([...fileIn.files]);fileIn.value=''};
['dragenter','dragover'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add('on')}));
['dragleave','drop'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove('on')}));
drop.addEventListener('drop',e=>add([...e.dataTransfer.files]));

async function add(files){
  err();const bad=[];
  for(const f of files){
    try{
      const buf=await AC().decodeAudioData(await f.arrayBuffer());
      clips.push({id:++uid,name:f.name,buf,start:0,end:buf.duration,peaks:peaks(buf)});
    }catch(e){bad.push(f.name)}
  }
  if(bad.length)err('تعذّر قراءة: '+bad.join('، ')+' — الصيغة غير مدعومة في هذا المتصفح.');
  build();
}
function peaks(b,n=1400){
  const d=b.getChannelData(0),step=Math.max(1,Math.floor(d.length/n)),p=new Float32Array(n);
  for(let i=0;i<n;i++){let m=0;for(let j=i*step,e=Math.min(d.length,j+step);j<e;j+=Math.max(1,step>>6)){const v=Math.abs(d[j]);if(v>m)m=v}p[i]=m}
  return p;
}

/* ---------- واجهة المقاطع ---------- */
function build(){
  stop();const L=$('#list');L.innerHTML='';
  if(!clips.length)L.innerHTML='<p class="empty">لا توجد مقاطع بعد. أضف ملفًا للبدء.</p>';
  clips.forEach((c,i)=>{
    const el=document.createElement('div');el.className='clip';
    el.innerHTML=`<div class="top"><span class="idx">${i+1}</span><span class="name" title="${c.name.replace(/"/g,'&quot;')}"></span>
      <button class="ib" data-a="play">تشغيل المحدد</button>
      <button class="ib" data-a="up" aria-label="أعلى">▲</button><button class="ib" data-a="dn" aria-label="أسفل">▼</button>
      <button class="ib" data-a="rm" aria-label="حذف">✕</button></div>
      <canvas></canvas>
      <div class="meta"><span>من <b class="s"></b></span><span>إلى <b class="e"></b></span><span>المدة <b class="d"></b></span><span class="sp"></span>
      <button class="ib" data-a="all">تحديد الكل</button></div>`;
    el.querySelector('.name').textContent=c.name;
    c.el=el;c.cv=el.querySelector('canvas');c.head=null;
    el.onclick=ev=>{const a=ev.target.dataset.a;if(!a)return;
      if(a==='rm')clips.splice(i,1);
      else if(a==='up'&&i>0)[clips[i-1],clips[i]]=[clips[i],clips[i-1]];
      else if(a==='dn'&&i<clips.length-1)[clips[i+1],clips[i]]=[clips[i],clips[i+1]];
      else if(a==='all'){c.start=0;c.end=c.buf.duration;draw(c);totals();return}
      else if(a==='play'){toggle(c,ev.target);return}
      build()};
    bindDrag(c);L.appendChild(el);
  });
  requestAnimationFrame(()=>{clips.forEach(draw);totals()});
}
function draw(c){
  const cv=c.cv,dpr=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
  if(!w)return;cv.width=w*dpr;cv.height=h*dpr;
  const g=cv.getContext('2d');g.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement),D=c.buf.duration;
  const x0=c.start/D*w,x1=c.end/D*w;
  g.fillStyle=cs.getPropertyValue('--sel');g.fillRect(x0,0,x1-x0,h);
  g.fillStyle=cs.getPropertyValue('--wave');
  const P=c.peaks,n=P.length,bw=w/n;
  for(let i=0;i<n;i++){const a=Math.max(1,P[i]*h*.46);g.fillRect(i*bw,h/2-a,Math.max(1,bw-.3),a*2)}
  g.fillStyle=cs.getPropertyValue('--cut');
  g.fillRect(x0-1,0,2,h);g.fillRect(x1-1,0,2,h);
  g.fillRect(x0-1,0,9,9);g.fillRect(x1-8,h-9,9,9);
  if(c.head!=null){g.fillStyle=cs.getPropertyValue('--ink');g.fillRect(c.head/D*w-1,0,2,h)}
  c.el.querySelector('.s').textContent=fmt(c.start);
  c.el.querySelector('.e').textContent=fmt(c.end);
  c.el.querySelector('.d').textContent=fmt(c.end-c.start);
}
function bindDrag(c){
  const cv=c.cv;let mode=null,anchor=0;
  const T=e=>{const r=cv.getBoundingClientRect();return Math.min(c.buf.duration,Math.max(0,(e.clientX-r.left)/r.width*c.buf.duration))};
  cv.onpointerdown=e=>{
    const t=T(e),px=c.buf.duration/cv.clientWidth*14;
    if(Math.abs(t-c.start)<px)mode='s';else if(Math.abs(t-c.end)<px)mode='e';else{mode='n';anchor=t;c.start=c.end=t}
    cv.setPointerCapture(e.pointerId);
  };
  cv.onpointermove=e=>{
    if(!mode)return;const t=T(e),min=.05;
    if(mode==='s')c.start=Math.min(t,c.end-min);
    else if(mode==='e')c.end=Math.max(t,c.start+min);
    else{c.start=Math.min(anchor,t);c.end=Math.max(anchor,t)}
    draw(c);totals();
  };
  cv.onpointerup=()=>{if(mode==='n'&&c.end-c.start<.05){c.start=0;c.end=c.buf.duration;draw(c);totals()}mode=null};
}
function totals(){
  const gap=+$('#gap').value||0,t=clips.reduce((s,c)=>s+c.end-c.start,0)+gap*Math.max(0,clips.length-1);
  $('#tot').textContent=clips.length?`المدة الإجمالية: ${fmt(t)} — ${clips.length} مقطع`:'';
  $('#go').disabled=!clips.length;
}
$('#gap').oninput=totals;
addEventListener('resize',()=>clips.forEach(draw));

/* ---------- المعاينة ---------- */
function stop(){
  if(cur){cur.src.onended=null;try{cur.src.stop()}catch(e){}cur.c.head=null;cur.btn.textContent='تشغيل المحدد';if(cur.c.cv.isConnected)draw(cur.c);cur=null}
  cancelAnimationFrame(raf);
}
function toggle(c,btn){
  const same=cur&&cur.c===c;stop();if(same)return;
  const a=AC();a.resume();
  const src=a.createBufferSource();src.buffer=c.buf;src.connect(a.destination);
  src.start(0,c.start,c.end-c.start);
  cur={src,c,btn,t0:a.currentTime};btn.textContent='إيقاف';
  src.onended=()=>{if(cur&&cur.src===src)stop()};
  (function tick(){if(!cur)return;c.head=Math.min(c.end,c.start+a.currentTime-cur.t0);draw(c);raf=requestAnimationFrame(tick)})();
}

/* ---------- الدمج والتصدير ---------- */
async function mix(sr,ch,gap,fade,prog){
  const parts=[];let total=0;
  for(let i=0;i<clips.length;i++){
    const c=clips[i],d=c.end-c.start;
    const o=new OfflineAudioContext(ch,Math.max(1,Math.round(d*sr)),sr);
    const s=o.createBufferSource(),g=o.createGain();s.buffer=c.buf;s.connect(g);g.connect(o.destination);
    if(fade){const f=Math.min(.05,d/2);g.gain.setValueAtTime(0,0);g.gain.linearRampToValueAtTime(1,f);g.gain.setValueAtTime(1,d-f);g.gain.linearRampToValueAtTime(0,d)}
    s.start(0,c.start,d);
    const r=await o.startRendering();parts.push(r);total+=r.length;
    prog((i+1)/clips.length*.4);
  }
  const gs=Math.round(gap*sr);total+=gs*(parts.length-1);
  const out=Array.from({length:ch},()=>new Float32Array(total));let off=0;
  parts.forEach(p=>{for(let k=0;k<ch;k++)out[k].set(p.getChannelData(k),off);off+=p.length+gs});
  return out;
}
const i16=f=>{const o=new Int16Array(f.length);for(let i=0;i<f.length;i++){const v=Math.max(-1,Math.min(1,f[i]));o[i]=v<0?v*32768:v*32767}return o};
async function toMp3(chs,sr,kbps,prog){
  if(typeof lamejs==='undefined')throw new Error('تعذّر تحميل مكتبة MP3 — تأكد من اتصال الإنترنت.');
  const enc=new lamejs.Mp3Encoder(chs.length,sr,kbps),L=i16(chs[0]),R=chs[1]?i16(chs[1]):null,out=[],B=1152*10;
  for(let i=0,n=0;i<L.length;i+=B,n++){
    const b=R?enc.encodeBuffer(L.subarray(i,i+B),R.subarray(i,i+B)):enc.encodeBuffer(L.subarray(i,i+B));
    if(b.length)out.push(b);
    if(n%15===0){prog(.4+.6*i/L.length);await new Promise(r=>setTimeout(r))}
  }
  const e=enc.flush();if(e.length)out.push(e);
  return new Blob(out,{type:'audio/mpeg'});
}
function toWav(chs,sr){
  const ch=chs.length,n=chs[0].length,buf=new ArrayBuffer(44+n*ch*2),v=new DataView(buf);
  const w=(o,s)=>[...s].forEach((x,i)=>v.setUint8(o+i,x.charCodeAt(0)));
  w(0,'RIFF');v.setUint32(4,36+n*ch*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*ch*2,true);v.setUint16(32,ch*2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*ch*2,true);
  let o=44;for(let i=0;i<n;i++)for(let k=0;k<ch;k++){const s=Math.max(-1,Math.min(1,chs[k][i]));v.setInt16(o,s<0?s*32768:s*32767,true);o+=2}
  return new Blob([buf],{type:'audio/wav'});
}
let lastUrl;
$('#go').onclick=async()=>{
  stop();err();const btn=$('#go'),bar=$('#bar'),fill=$('#fill');
  btn.disabled=true;bar.style.display='block';$('#res').style.display='none';
  const prog=p=>fill.style.width=Math.round(p*100)+'%';prog(0);
  try{
    const sr=+$('#sr').value,ch=+$('#ch').value,f=$('#fmt').value;
    const chs=await mix(sr,ch,Math.max(0,+$('#gap').value||0),$('#fade').checked,prog);
    const blob=f==='mp3'?await toMp3(chs,sr,+$('#kbps').value,prog):toWav(chs,sr);
    prog(1);
    if(lastUrl)URL.revokeObjectURL(lastUrl);lastUrl=URL.createObjectURL(blob);
    $('#pl').src=lastUrl;
    const name=($('#fname').value.trim()||'merged').replace(/[\\/:*?"<>|]/g,'_');
    $('#dl').href=lastUrl;$('#dl').download=name+'.'+f;
    $('#dl').textContent=`تحميل ${name}.${f} (${(blob.size/1048576).toFixed(2)} MB)`;
    $('#res').style.display='block';
  }catch(e){err('حدث خطأ أثناء التصدير: '+e.message)}
  btn.disabled=!clips.length;setTimeout(()=>bar.style.display='none',600);
};
build();
<\/script>
</body>
</html>
</script>
<script type="text/plain" id="tpl-v"><!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Cairo:wght@400;700&family=Tajawal:wght@400;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#111317;--p:#1a1d23;--l:#2b3039;--ink:#eceef2;--m:#8f96a3;--a:#ff6a4d;--clip:#2f6f78;--sel:#ffd166}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 "IBM Plex Sans Arabic",system-ui,sans-serif;padding:14px}
header{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
h1{font-size:22px;margin:0}header span{color:var(--m)}

@media(max-width:800px){.top{grid-template-columns:1fr}}
.box{background:var(--p);border:1px solid var(--l);border-radius:12px;padding:12px}
button,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--l);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--m)}button:disabled{opacity:.45;cursor:default}
button:focus-visible,select:focus-visible,.drop:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.pri{background:var(--a);border-color:var(--a);color:#fff;font-weight:700}
.drop{border:2px dashed var(--l);border-radius:10px;padding:14px;text-align:center;cursor:pointer;color:var(--m)}
.drop.on,.drop:hover{border-color:var(--a)}
.drop b{color:var(--ink)}
#bin{display:grid;gap:8px;max-height:340px;overflow:auto;margin-top:10px}
.item{display:flex;gap:8px;align-items:center;background:var(--bg);border-radius:8px;padding:6px}
.item img{width:64px;height:36px;object-fit:cover;border-radius:4px;background:#000}
.item div:nth-of-type(1){flex:1;min-width:0}
.item b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;font-size:13px}
.item small{color:var(--m)}
.stage{position:relative;background:#000;border-radius:10px;overflow:hidden}
#cv{display:block;width:100%;height:auto;max-height:52vh;object-fit:contain;background:#000}
.ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--m);text-align:center;padding:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 0}
.time{font-variant-numeric:tabular-nums;direction:ltr;color:var(--m);margin-inline-start:auto}
#wrap{overflow-x:auto;direction:ltr;position:relative;border-radius:8px;background:var(--bg);border:1px solid var(--l);margin-top:10px}
#tl{position:relative;padding-bottom:6px;min-width:100%}
#ruler{height:28px;border-bottom:1px solid var(--l);position:relative;cursor:pointer;touch-action:none}
.tick{position:absolute;top:0;height:100%;border-left:1px solid var(--l);padding-left:4px;font-size:11px;color:var(--m);pointer-events:none}
#track{position:relative;height:84px;margin-top:6px}
.clip{position:absolute;top:0;height:100%;border-radius:6px;background:var(--clip) repeat-x left/auto 100%;overflow:hidden;border:2px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 100vmax rgba(0,0,0,.4);touch-action:none}
.clip.sel{border-color:var(--sel)}
.clip span{position:absolute;left:14px;bottom:4px;font-size:11px;text-shadow:0 1px 2px #000;white-space:nowrap;pointer-events:none}
.h{position:absolute;top:0;width:10px;height:100%;background:var(--sel);opacity:0;cursor:ew-resize}
.clip:hover .h,.clip.sel .h,.ov:hover .h,.ov.sel .h{opacity:.9}
.h.l{left:0}.h.r{right:0}
#head{position:absolute;top:0;bottom:0;width:2px;background:var(--a);pointer-events:none;z-index:5}
#head:before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:var(--a)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#ovrows{position:relative;margin-top:4px}
.orow{position:absolute;left:0;right:0;height:38px;border-bottom:1px dashed var(--l)}
.orow:before{content:"طبقة " attr(data-r);display:inline-block;position:sticky;left:6px;font-size:10px;color:var(--m);padding-left:6px}
.ov{position:absolute;border-radius:6px;overflow:hidden;cursor:grab;border:2px solid transparent;touch-action:none;background:#5b4b8a;background-size:auto 100%;box-shadow:inset 0 0 0 100vmax rgba(0,0,0,.3)}
.ov.text{background-color:#8a5b2f}.ov.image{background-color:#2f6a4a;background-repeat:no-repeat;background-position:6px center}.ov.video{background-color:#4b5f9a}.ov.audio{background-color:#2f7a6a}
.ov.sel{border-color:var(--sel)}
.ov span{position:absolute;left:14px;right:14px;top:50%;transform:translateY(-50%);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000;pointer-events:none;unicode-bidi:plaintext}
textarea,input[type=number]{font:inherit;color:inherit;background:var(--p);border:1px solid var(--l);border-radius:8px;padding:6px 8px}
.hint{color:var(--m);font-size:12px;margin:8px 0 0}
.msg{color:var(--a);min-height:1.2em;margin:8px 0 0}
#res{display:none;margin-top:12px}
#res video{width:100%;max-height:300px;background:#000;border-radius:8px}
#res a{display:inline-block;margin-top:8px;background:#2e9d6a;color:#fff;text-decoration:none;padding:8px 18px;border-radius:8px;font-weight:700}
input[type=range]{accent-color:var(--a)}
</style>
</head>
<body>
<header><h1>استوديو الفيديو</h1><span>قص، تقسيم، ترتيب، وتصدير — كله داخل المتصفح</span></header>

<div class="top">
  <div class="box">
    <div class="drop" id="drop" tabindex="0" role="button"><b>أضف فيديوهات</b><br>اسحب الملفات أو اضغط للاختيار<input type="file" id="file" accept="video/*" multiple hidden></div>
    <div id="bin"></div>
  </div>
  <div class="box">
    <div class="stage"><canvas id="cv" width="1280" height="720"></canvas><div class="ph" id="ph">أضف مقطعًا إلى التايم لاين لبدء المعاينة</div></div>
    <div class="bar"><button id="play" class="pri">▶ تشغيل</button>
      <label class="row" style="gap:6px">النسبة <select id="asp"><option value="auto">كما هي</option><option value="16:9">16:9</option><option value="9:16">9:16 (ريلز)</option><option value="1:1">1:1</option><option value="4:5">4:5</option><option value="4:3">4:3</option></select></label>
      <span class="time" id="time">0:00.0 / 0:00.0</span></div>
  </div>
</div>

<div class="box">
  <div class="row">
    <button id="bundo">↶ تراجع</button><button id="bredo">↷ إعادة</button>
    <button id="split">✂ تقسيم عند المؤشر (S)</button>
    <button id="bdup">⧉ نسخ</button><button id="bdet">فصل الصوت</button>
    <label class="row"><input type="checkbox" id="msnap" checked> مغناطيس</label>
    <button id="del">حذف المحدد (Delete)</button>
    <button id="mute">كتم / تشغيل صوت المقطع</button>
    <button id="bk">◀ تقديم</button><button id="fw">تأخير ▶</button>
    <div id="cprops" style="display:none;flex:1 1 360px;padding:8px 10px;background:var(--bg);border:1px solid var(--l);border-radius:8px">
      <div class="row">
        <label class="row">السرعة <input type="range" id="csp" min="0.25" max="4" step="0.05"><b id="cspv" style="min-width:48px;direction:ltr">1x</b></label>
        <label class="row">الصوت <input type="range" id="cvol" min="0" max="100"></label>
        <label class="row">ظهور <input type="number" id="cfi" min="0" step="0.1" style="width:64px"></label>
        <label class="row">اختفاء <input type="number" id="cfo" min="0" step="0.1" style="width:64px"></label>
        <label class="row">انتقال قبل المقطع <select id="ctr"><option value="none">بدون</option><option value="black">تلاشي عبر الأسود</option><option value="white">تلاشي عبر الأبيض</option></select></label>
        <label class="row">مدته <input type="number" id="ctd" min="0.1" step="0.1" style="width:64px"></label>
      </div>
    </div>
    <div id="props" style="display:none;flex:1 1 360px;padding:8px 10px;background:var(--bg);border:1px solid var(--l);border-radius:8px">
    <div class="row" id="pt" style="margin-bottom:8px">
      <textarea id="ptxt" rows="2" dir="auto" placeholder="اكتب النص هنا (يدعم العربية)" style="flex:1;min-width:200px"></textarea>
      <select id="pfont"><option>IBM Plex Sans Arabic</option><option>Cairo</option><option>Tajawal</option><option>Amiri</option><option>Arial</option></select>
      <label class="row">حجم الخط <input type="range" id="pfs" min="2" max="25"></label>
      <input type="color" id="pcol" value="#ffffff" aria-label="لون النص">
      <label class="row"><input type="checkbox" id="pbold"> عريض</label>
      <label class="row"><input type="checkbox" id="pbg"> خلفية</label>
      <label class="row">حد النص <input type="range" id="psw" min="0" max="20"></label><input type="color" id="psc" value="#000000" aria-label="لون الحد">
    </div>
    <div class="row">
      <label class="row vis">أفقي <input type="range" id="px" min="0" max="100"></label>
      <label class="row vis">رأسي <input type="range" id="py" min="0" max="100"></label>
      <label class="row" id="pwl">المقاس <input type="range" id="pw" min="3" max="100"></label>
      <label class="row vis">الشفافية <input type="range" id="pop" min="5" max="100"></label>
      <label class="row">البداية <input type="number" id="pst" step="0.1" min="0" style="width:76px"></label>
      <label class="row">المدة <input type="number" id="pdu" step="0.1" min="0.1" style="width:76px"></label>
      <label class="row">ظهور <input type="number" id="pfi" min="0" step="0.1" style="width:64px"></label>
      <label class="row">اختفاء <input type="number" id="pfo" min="0" step="0.1" style="width:64px"></label>
      <label class="row vis">حركة الدخول <select id="pai"><option value="none">بدون</option><option value="fade">ظهور تدريجي</option><option value="up">صعود</option><option value="down">هبوط</option><option value="left">من اليسار</option><option value="right">من اليمين</option><option value="zoom">تكبير</option><option value="pop">بوب</option><option value="type">كتابة (للنص)</option></select></label>
      <label class="row vis">حركة الخروج <select id="pao"><option value="none">بدون</option><option value="fade">ظهور تدريجي</option><option value="up">صعود</option><option value="down">هبوط</option><option value="left">من اليسار</option><option value="right">من اليمين</option><option value="zoom">تكبير</option><option value="pop">بوب</option><option value="type">كتابة (للنص)</option></select></label>
      <label class="row vis">مدتها <input type="number" id="pad" min="0.1" step="0.1" style="width:64px"></label>
      <label class="row" id="pvl">الصوت <input type="range" id="pvol" min="0" max="100"></label>
      <label class="row" id="pml"><input type="checkbox" id="pmute"> كتم الصوت</label>
      <button id="pdel">حذف الطبقة</button>
    </div>
      </div>
    <label class="row" style="margin-inline-start:auto">تكبير <input type="range" id="zoom" min="10" max="240" value="60"></label>
  </div>
  <div id="fx" style="display:none;margin-top:10px;padding:8px 10px;background:var(--bg);border:1px solid var(--l);border-radius:8px">
    <div class="row fxv">
      <b>الألوان</b>
      <select id="fpre"><option value="">فلتر جاهز…</option><option value="none">بدون</option><option value="bw">أبيض وأسود</option><option value="sepia">سيبيا</option><option value="warm">دافئ</option><option value="cool">بارد</option><option value="vivid">حيوي</option><option value="vintage">قديم</option><option value="dark">داكن</option></select>
      <label class="row">السطوع <input type="range" id="fbr" min="30" max="200"></label>
      <label class="row">التباين <input type="range" id="fco" min="30" max="200"></label>
      <label class="row">التشبّع <input type="range" id="fsa" min="0" max="250"></label>
      <label class="row">درجة اللون <input type="range" id="fhu" min="-180" max="180"></label>
      <label class="row">بلور <input type="range" id="fbl" min="0" max="20"></label>
    </div>
    <div class="row" style="margin-top:6px">
      <b>التحويل</b>
      <label class="row">تدوير <input type="range" id="frot" min="-180" max="180"></label>
      <button id="frot90">↻ 90°</button>
      <label class="row fxv"><input type="checkbox" id="ffh"> قلب أفقي</label>
      <label class="row fxv"><input type="checkbox" id="ffv"> قلب رأسي</label>
      <label class="row fxm"><input type="checkbox" id="ffill"> ملء الإطار</label>
      <button id="freset">إعادة ضبط المظهر</button>
    </div>
    <div class="row fxv" style="margin-top:6px">
      <b>القص %</b>
      <label class="row">يسار <input type="range" id="fcl" min="0" max="45"></label>
      <label class="row">يمين <input type="range" id="fcr" min="0" max="45"></label>
      <label class="row">أعلى <input type="range" id="fct" min="0" max="45"></label>
      <label class="row">أسفل <input type="range" id="fcb" min="0" max="45"></label>
    </div>
  </div>
  <div class="row" style="margin-top:10px">
    <button id="addt">T + نص</button>
    <button id="addi">🖼 + صورة / لوجو</button><input type="file" id="imgf" accept="image/*" multiple hidden>
    <button id="badda">🎵 + صوت / موسيقى</button><input type="file" id="audf" accept="audio/*" multiple hidden>
    <button id="addl">＋ طبقة</button>
    <span style="color:var(--m);font-size:12px">فيديو فوق الفيديو: زر «+ فوق الفيديو» في مكتبة الملفات. الطبقات الأعلى تظهر فوق الأدنى.</span>
  </div>
  <div id="wrap"><div id="tl"><div id="ruler"></div><div id="ovrows"></div><div id="track"></div><div id="head"></div></div></div>

  <p class="hint">اضغط على الشريط العلوي للتنقل. اسحب الحافة الصفراء لأي مقطع لقصّ بدايته أو نهايته. التقديم والتأخير يغيّران ترتيب المقطع المحدد.</p>
  <p class="msg" id="err"></p>
</div>

<div class="box" style="margin-top:12px">
  <div class="row">
    <label class="row">الدقة
      <select id="res"><option value="native">الدقة الأصلية للفيديو</option><option value="3840x2160">4K</option><option value="1920x1080">1080p</option><option value="1280x720">720p</option><option value="854x480">480p</option></select>
    </label>
    <label class="row">الجودة
      <select id="q"><option value="25">عالية (25 Mbps)</option><option value="60" selected>عالية جدًا (60 Mbps)</option><option value="120">قصوى (120 Mbps)</option></select>
    </label>
    <label class="row">الإطارات
      <select id="fps"><option value="24">24</option><option value="30" selected>30</option><option value="60">60</option></select>
    </label>
    <button id="go" class="pri" disabled>تصدير الفيديو</button>
    <span id="xmsg" style="color:var(--m)"></span>
  </div>
  <p class="hint">التصدير يتم بالزمن الحقيقي (مدة التصدير = مدة الفيديو). أبقِ التبويب ظاهرًا حتى ينتهي.</p>
  <div id="out"><div id="res2"></div></div>
  <div id="result" style="display:none;margin-top:12px"><video id="rv" controls></video><br><a id="dl" style="display:inline-block;margin-top:8px;background:#2e9d6a;color:#fff;text-decoration:none;padding:8px 18px;border-radius:8px;font-weight:700">تحميل</a></div>
</div>

<script>
const $=s=>document.querySelector(s);
const cv=$('#cv'),g=cv.getContext('2d');
let AC,master,spk,dest,media=[],clips=[],sel=null,t=0,playing=false,exporting=false,act=null,actStart=0,pps=60,uid=0,rec,chunks;
const fmt=x=>{x=Math.max(0,x);return Math.floor(x/60)+':'+(x%60).toFixed(1).padStart(4,'0')};
const sp=c=>c.sp||1,dur=c=>(c.out-c.in)/sp(c);
const total=()=>clips.reduce((s,c)=>s+dur(c),0);
const startOf=c=>{let a=0;for(const k of clips){if(k===c)break;a+=dur(k)}return a};
const err=m=>$('#err').textContent=m||'';
function audio(){
  if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();dest=AC.createMediaStreamDestination();spk=AC.createGain();master.connect(dest);master.connect(spk);spk.connect(AC.destination)}
  AC.resume();
}

/* ---------- استيراد ---------- */
const drop=$('#drop'),fi=$('#file');
drop.onclick=()=>fi.click();
drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fi.click()}};
fi.onchange=()=>{imp([...fi.files]);fi.value=''};
['dragenter','dragover'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add('on')}));
['dragleave','drop'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove('on')}));
drop.addEventListener('drop',e=>imp([...e.dataTransfer.files]));
async function imp(files){
  err();const bad=[];
  for(const f of files){try{await load(f)}catch(e){bad.push(f.name)}}
  if(bad.length)err('تعذّر قراءة: '+bad.join('، ')+' — الصيغة أو الكودك غير مدعوم في هذا المتصفح.');
  bin();
}
async function load(f){
  audio();
  const v=document.createElement('video');v.src=URL.createObjectURL(f);v.preload='auto';v.playsInline=true;
  await new Promise((ok,no)=>{v.onloadedmetadata=ok;v.onerror=no});
  const m={name:f.name,v,dur:v.duration,thumb:''};
  const gn=AC.createGain();AC.createMediaElementSource(v).connect(gn);gn.connect(master);m.gain=gn;
  const sk=new Promise(r=>v.onseeked=r);v.currentTime=Math.min(.5,v.duration/2);await sk;
  const c=document.createElement('canvas');c.width=160;c.height=90;c.getContext('2d').drawImage(v,0,0,160,90);
  m.thumb=c.toDataURL('image/jpeg',.6);media.push(m);
}
function bin(){
  const B=$('#bin');B.innerHTML='';
  media.forEach(m=>{
    const e=document.createElement('div');e.className='item';
    e.innerHTML='<img alt=""><div><b></b><small></small></div><div style="display:grid;gap:4px"><button class="a">+ تايم لاين</button><button class="o">+ فوق الفيديو</button></div>';
    e.querySelector('img').src=m.thumb;e.querySelector('b').textContent=m.name;e.querySelector('small').textContent=fmt(m.dur);
    e.querySelector('.o').onclick=()=>addVid(m);
    e.querySelector('.a').onclick=()=>{
      snap();const c={id:++uid,m,in:0,out:m.dur,mute:false,sp:1,vol:1,fi:0,fo:0,tr:'none',td:.6,fill:$('#asp').value!=='auto'};clips.push(c);sel=c.id;build();select(c.id);
      if(clips.length===1)setT(0);
    };
    B.appendChild(e);
  });
}

/* ---------- المحرك ---------- */
function place(tt,play){
  let a=0,hit=null;
  for(const c of clips){const d=dur(c);if(tt<a+d||c===clips[clips.length-1]){hit=c;break}a+=d}
  if(!hit){if(act)act.m.v.pause();act=null;return}
  if(act&&act.m!==hit.m)act.m.v.pause();
  act=hit;actStart=a;
  const v=hit.m.v,l=Math.min(hit.out,hit.in+Math.max(0,tt-a)*sp(hit));
  v.muted=false;v.playbackRate=sp(hit);
  if(!play||Math.abs(v.currentTime-l)>.2)v.currentTime=l;
  if(play)v.play().catch(()=>{});else v.pause();
}
function setT(x){t=Math.min(Math.max(0,x),total());place(t,playing);head()}
function stopPlay(){
  playing=false;if(act)act.m.v.pause();$('#play').textContent='▶ تشغيل';
  if(exporting&&rec&&rec.state==='recording')setTimeout(()=>rec.stop(),300);
}
function toggle(){
  if(!clips.length||exporting)return;
  if(playing){stopPlay();return}
  audio();if(t>=total()-.05)t=0;
  playing=true;$('#play').textContent='⏸ إيقاف';place(t,true);
}
function loop(){
  if(playing&&act){
    const v=act.m.v;
    if(v.currentTime>=act.out-.04||v.ended){
      const nx=actStart+dur(act);
      if(nx>=total()-.05){t=total();stopPlay()}else{t=nx;place(t,true)}
    }else t=actStart+Math.max(0,v.currentTime-act.in)/sp(act);
  }
  syncOv();mixAud();draw();head();requestAnimationFrame(loop);
}
function draw(){
  const W=cv.width,H=cv.height;g.fillStyle='#000';g.fillRect(0,0,W,H);
  if(act&&act.m.v.readyState>1){
    const v=act.m.v;paint(v,v.videoWidth,v.videoHeight,act,W,H,true);
  }
  const cvr=cover();if(cvr.a>0){g.globalAlpha=cvr.a;g.fillStyle=cvr.col;g.fillRect(0,0,W,H);g.globalAlpha=1}
  ovs.filter(o=>t>=o.start&&t<o.start+o.dur).sort((a,b)=>a.row-b.row).forEach(drawOv);
}
function head(){
  const x=t*pps;$('#head').style.left=x+'px';
  $('#time').textContent=fmt(t)+' / '+fmt(total());
  const w=$('#wrap');if(playing&&(x>w.scrollLeft+w.clientWidth-30||x<w.scrollLeft))w.scrollLeft=Math.max(0,x-40);
  if(exporting)$('#xmsg').textContent='جارٍ التصدير… '+Math.round(t/Math.max(.1,total())*100)+'%';
}

/* ---------- التايم لاين ---------- */
const seekEv=e=>setT((e.clientX-$('#tl').getBoundingClientRect().left)/pps);
function select(id){sel=id;clips.forEach(c=>c.e&&c.e.classList.toggle('sel',c.id===id));ovs.forEach(o=>o.e&&o.e.classList.toggle('sel',o.id===id));fillProps()}
function build(){
  buildOv();
  const tr=$('#track');tr.innerHTML='';
  clips.forEach(c=>{
    const e=document.createElement('div');e.className='clip'+(c.id===sel?' sel':'');
    e.style.backgroundImage='url('+c.m.thumb+')';c.e=e;
    e.innerHTML='<i class="h l"></i><span></span><i class="h r"></i>';
    e.querySelector('span').textContent=c.m.name+(c.mute?'  🔇':'');
    e.onpointerdown=ev=>{
      if(ev.target.classList.contains('h'))return trim(ev,c,ev.target.classList.contains('l'));
      select(c.id);seekEv(ev);
    };
    tr.appendChild(e);
  });
  applyRes();layout();
}
function layout(){
  let a=0;clips.forEach(c=>{const d=dur(c);c.e.style.left=a*pps+'px';c.e.style.width=d*pps+'px';a+=d});

  for(const f of e.target.files){

    try{await new Promise((ok,no)=>{o.v.onloadedmetadata=ok;o.v.onerror=no})}catch(x){err('تعذّر قراءة '+f.name);continue}
    o.m={dur:o.v.duration};o.dur=o.v.duration;addOv(o);
  }
  e.target.value='';
};

/* ===== المظهر: فلاتر، قص، تدوير، حركة ===== */
function filt(o){
  const a=[];
  if(o.br!=null&&o.br!==100)a.push('brightness('+o.br+'%)');
  if(o.co!=null&&o.co!==100)a.push('contrast('+o.co+'%)');
  if(o.sa!=null&&o.sa!==100)a.push('saturate('+o.sa+'%)');
  if(o.hu)a.push('hue-rotate('+o.hu+'deg)');
  if(o.gr)a.push('grayscale('+o.gr+'%)');
  if(o.se)a.push('sepia('+o.se+'%)');
  if(o.bl)a.push('blur('+(o.bl*cv.width/1000).toFixed(1)+'px)');
  return a.join(' ')||'none';
}
function paint(src,sw,sh,o,W,H,main){
  const cl=o.cl||0,cr=o.cr||0,ct=o.ct||0,cb=o.cb||0,sW=sw*(1-(cl+cr)/100),sH=sh*(1-(ct+cb)/100),a=(o.rot||0)*Math.PI/180;
  let w,h;
  if(main){
    const rw=Math.abs(sW*Math.cos(a))+Math.abs(sH*Math.sin(a)),rh=Math.abs(sW*Math.sin(a))+Math.abs(sH*Math.cos(a));
    const k=o.fill?Math.max(W/rw,H/rh):Math.min(W/rw,H/rh);w=sW*k;h=sH*k;
  }else{w=o.w*W;h=w*sH/sW}
  g.save();g.filter=filt(o);
  if(main){g.translate(W/2,H/2);g.rotate(a)}
  g.scale(o.fh?-1:1,o.fv?-1:1);
  g.drawImage(src,sw*cl/100,sh*ct/100,sW,sH,-w/2,-h/2,w,h);
  g.restore();
  return{w,h};
}
function anim(o,W,H){
  const lt=t-o.start,ad=o.ad||.6,r={a:1,dx:0,dy:0,sc:1,tp:1};
  const ap=(k,x)=>{
    if(!k||k==='none')return;x=Math.min(1,Math.max(0,x));const p=1-Math.pow(1-x,3);
    if(['fade','up','down','left','right','zoom'].includes(k))r.a*=p;
    if(k==='up')r.dy+=(1-p)*H*.08;
    if(k==='down')r.dy-=(1-p)*H*.08;
    if(k==='left')r.dx-=(1-p)*W*.15;
    if(k==='right')r.dx+=(1-p)*W*.15;
    if(k==='zoom')r.sc*=.6+.4*p;
    if(k==='pop'){r.a*=Math.min(1,x*4);r.sc*=Math.max(.001,1+2.70158*Math.pow(x-1,3)+1.70158*Math.pow(x-1,2))}
    if(k==='type')r.tp*=x;
  };
  ap(o.ai,lt/ad);ap(o.ao,(o.dur-lt)/ad);
  return r;
}
const FXP={none:{},bw:{gr:100},sepia:{se:80},warm:{sa:120,se:25,br:105},cool:{hu:-25,sa:110},vivid:{co:115,sa:150},vintage:{co:90,sa:80,se:35,br:105},dark:{br:80,co:125}};
const FXK=['br','co','sa','hu','gr','se','bl'],FXALL=[...FXK,'rot','fh','fv','fill','cl','cr','ct','cb'];
const fxT=()=>clips.find(k=>k.id===sel)||ovs.find(o=>o.id===sel&&o.type!=='audio');
function fillFx(){
  const o=fxT();P('fx').style.display=o?'block':'none';if(!o)return;
  const txt=o.type==='text';
  document.querySelectorAll('#fx .fxv').forEach(x=>x.style.display=txt?'none':'flex');
  document.querySelectorAll('#fx .fxm').forEach(x=>x.style.display=o.type?'none':'flex');
  P('fbr').value=o.br??100;P('fco').value=o.co??100;P('fsa').value=o.sa??100;P('fhu').value=o.hu||0;P('fbl').value=o.bl||0;
  P('frot').value=o.rot||0;P('ffh').checked=!!o.fh;P('ffv').checked=!!o.fv;P('ffill').checked=!!o.fill;
  P('fcl').value=o.cl||0;P('fcr').value=o.cr||0;P('fct').value=o.ct||0;P('fcb').value=o.cb||0;
}
P('fx').oninput=e=>{
  const o=fxT();if(!o)return;snap(true);
  if(e.target.id==='fpre'){const pr=FXP[P('fpre').value];if(pr){FXK.forEach(k=>delete o[k]);Object.assign(o,pr)}P('fpre').value='';fillFx();return}
  o.br=+P('fbr').value;o.co=+P('fco').value;o.sa=+P('fsa').value;o.hu=+P('fhu').value;o.bl=+P('fbl').value;
  o.rot=+P('frot').value;o.fh=P('ffh').checked;o.fv=P('ffv').checked;o.fill=P('ffill').checked;
  o.cl=+P('fcl').value;o.cr=+P('fcr').value;o.ct=+P('fct').value;o.cb=+P('fcb').value;
};
P('frot90').onclick=()=>{const o=fxT();if(!o)return;snap();o.rot=(o.rot||0)+90;if(o.rot>180)o.rot-=360;fillFx()};
P('freset').onclick=()=>{const o=fxT();if(!o)return;snap();FXALL.forEach(k=>delete o[k]);fillFx()};

build();loop();
<\/script>

<script>
const loaded={};
function show(k){
  for(const x of ['a','v']){
    const f=document.getElementById('f-'+x),on=x===k;
    f.hidden=!on;
    document.getElementById('t-'+x).setAttribute('aria-selected',on);
    if(on&&!loaded[x]){
      loaded[x]=1;
      f.srcdoc=document.getElementById('tpl-'+x).textContent.replace(/<\\\/script/g,'</script');
    }
  }
  history.replaceState(null,'','#'+k);
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.k));
show(location.hash==='#v'?'v':'a');
</script>
