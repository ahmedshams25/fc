<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClientChat - Professional Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap');
        body { font-family: 'IBM Plex Sans Arabic', sans-serif; background-color: #F8F9FE; overflow-x: hidden; }
        .project-view, #app-content, #auth-screen { display: none; }
        .active { display: block !important; }
        .flex-active { display: flex !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #E5E7EB; border-radius: 10px; }
    </style>
</head>
<body class="text-gray-800 text-right">

    <!-- شاشة تسجيل الدخول -->
    <div id="auth-screen" class="h-screen w-full flex items-center justify-center bg-indigo-50 p-4 active">
        <div class="bg-white p-8 rounded-[32px] shadow-xl w-full max-w-md border border-gray-100">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center text-white text-2xl mx-auto mb-4">
                    <i class="fas fa-comment-dots"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-800">مرحباً بك</h1>
            </div>
            <div class="space-y-4">
                <input type="email" id="auth-email" class="w-full p-4 bg-gray-50 border-none rounded-2xl outline-none" placeholder="البريد الإلكتروني">
                <input type="password" id="auth-password" class="w-full p-4 bg-gray-50 border-none rounded-2xl outline-none" placeholder="كلمة المرور">
                <button onclick="window.login()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg">تسجيل دخول</button>
                <button onclick="window.signup()" class="w-full text-indigo-600 text-sm font-bold">إنشاء حساب جديد</button>
            </div>
        </div>
    </div>

    <!-- محتوى التطبيق -->
    <div id="app-content" class="h-screen flex w-full">
        <!-- القائمة الجانبية (نفس تصميمك الأصلي) -->
        <aside id="main-sidebar" class="w-64 bg-white border-l border-gray-200 flex flex-col p-4">
            <div class="flex items-center justify-between mb-10 px-2">
                <span class="text-xl font-bold text-indigo-600">ClientChat</span>
            </div>
            <nav class="flex-1 space-y-2 overflow-y-auto custom-scrollbar" id="sidebar-projects-list"></nav>
            <button onclick="window.logout()" class="p-3 text-red-500 font-bold border-t mt-auto">تسجيل الخروج</button>
        </aside>

        <main class="flex-1 overflow-y-auto p-8">
            <!-- عرض المشاريع -->
            <section id="view-projects-list" class="project-view active">
                <div class="flex justify-between items-center mb-8">
                    <h2 class="text-2xl font-bold">مشاريعك</h2>
                    <button onclick="window.createNewProject()" class="bg-indigo-600 text-white px-6 py-3 rounded-xl">+ مشروع جديد</button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="projects-grid"></div>
            </section>

            <!-- تفاصيل المشروع (نفس عناصرك الأصلية) -->
            <section id="view-project-detail" class="project-view">
                <button onclick="window.showView('projects-list')" class="mb-4 text-indigo-600 font-bold">← العودة للمشاريع</button>
                <div class="bg-white p-8 rounded-3xl border border-gray-100">
                    <h1 id="detail-title" class="text-3xl font-bold mb-2">--</h1>
                    <p id="detail-desc" class="text-gray-500 mb-6">--</p>
                    <div class="grid grid-cols-2 gap-4 mb-8">
                        <div class="p-4 bg-indigo-50 rounded-2xl">
                            <p class="text-xs text-gray-400">العميل</p>
                            <p id="detail-client" class="font-bold">--</p>
                        </div>
                        <div class="p-4 bg-green-50 rounded-2xl">
                            <p class="text-xs text-gray-400">الميزانية</p>
                            <p id="detail-cost" class="font-bold text-green-600">--</p>
                        </div>
                    </div>
                    <!-- (هنا يمكنك إضافة باقي عناصرك: التاسكات، المحادثة، إلخ بنفس الـ IDs) -->
                </div>
            </section>
        </main>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBTIMg3VoLM96vSWk0WktbWhZnqhvsEeJM",
            authDomain: "projects-1b2f4.firebaseapp.com",
            projectId: "projects-1b2f4",
            storageBucket: "projects-1b2f4.firebasestorage.app",
            messagingSenderId: "832971856969",
            appId: "1:832971856969:web:a55f4e4736a345f6d93398"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let projects = [];
        let currentUser = null;

        // --- Auth Functions ---
        window.login = async () => {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-password').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (e) { alert("خطأ في الدخول: " + e.message); }
        };

        window.signup = async () => {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-password').value;
            try {
                await createUserWithEmailAndPassword(auth, email, pass);
                alert("تم إنشاء الحساب بنجاح!");
            } catch (e) { alert("خطأ في التسجيل: " + e.message); }
        };

        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-screen').classList.remove('active');
                document.getElementById('app-content').classList.add('flex-active');
                await loadData();
            } else {
                document.getElementById('auth-screen').classList.add('active');
                document.getElementById('app-content').classList.remove('flex-active');
            }
        });

        // --- Data Functions ---
        async function loadData() {
            try {
                const docRef = doc(db, "users", currentUser.uid);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    projects = docSnap.data().projects || [];
                } else {
                    await setDoc(docRef, { projects: [] });
                }
                renderProjects();
            } catch (e) { console.error("Error loading:", e); }
        }

        window.saveData = async () => {
            try {
                const docRef = doc(db, "users", currentUser.uid);
                await updateDoc(docRef, { projects: projects });
                renderProjects();
            } catch (e) { alert("حدث خطأ أثناء الحفظ في فايربيز: " + e.message); }
        };

        window.createNewProject = async () => {
            const title = prompt("اسم المشروع:");
            if (!title) return;
            const p = { id: Date.now(), title, client: 'عميل جديد', cost: '$0', desc: 'وصف المشروع', isArchived: false };
            projects.push(p);
            await window.saveData();
        };

        window.renderProjects = () => {
            const grid = document.getElementById('projects-grid');
            grid.innerHTML = '';
            projects.forEach(p => {
                grid.innerHTML += `
                    <div onclick="window.openProject(${p.id})" class="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm cursor-pointer hover:shadow-md transition">
                        <div class="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-xl mb-4 flex items-center justify-center font-bold">${p.title[0]}</div>
                        <h4 class="font-bold">${p.title}</h4>
                        <p class="text-xs text-gray-400">${p.client}</p>
                    </div>`;
            });
        };

        window.openProject = (id) => {
            const p = projects.find(x => x.id === id);
            document.getElementById('detail-title').innerText = p.title;
            document.getElementById('detail-client').innerText = p.client;
            document.getElementById('detail-cost').innerText = p.cost;
            document.getElementById('detail-desc').innerText = p.desc;
            window.showView('project-detail');
        };

        window.showView = (v) => {
            document.querySelectorAll('.project-view').forEach(el => el.classList.remove('active'));
            document.getElementById('view-' + v).classList.add('active');
        };
    </script>
</body>
</html>
