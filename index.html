<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC Pro Tracker</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        :root {
            --bg-dark: #10101d;
            --bg-light: #1c1c2b;
            --card-bg: #252538;
            --primary: #00ff9d;
            --secondary: #00c6ff;
            --accent: #ff3b5f;
            --text-light: #f5f5f5;
            --text-dark: #222;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-light);
            background-image: linear-gradient(145deg, var(--bg-dark) 0%, var(--bg-light) 100%);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1, h2 {
            font-weight: 900;
            text-shadow: 0 0 15px rgba(0, 255, 157, 0.3);
        }

        h1 {
            font-size: 2.8rem;
            color: var(--primary);
            margin-bottom: 20px;
        }

        h2 {
            color: var(--secondary);
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        /* Player Setup Section */
        #player-setup {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }

        .player-inputs {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .player-input-group {
            position: relative;
        }

        .player-name-input {
            width: 100%;
            background: var(--bg-light);
            border: 2px solid #444;
            border-radius: 10px;
            padding: 12px;
            color: var(--text-light);
            font-size: 1rem;
            text-align: center;
        }
        .player-name-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .total-wins {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
        }
         .crown {
            color: #ffd700;
            text-shadow: 0 0 5px #ffc400;
        }

        /* Match Selection Screen */
        #match-selection {
            margin-bottom: 30px;
        }

        .player-selection-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
        }

        .player-select-card {
            background: var(--card-bg);
            padding: 20px 15px;
            border-radius: 15px;
            border: 2px solid #444;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .player-select-card.selected {
            border-color: var(--primary);
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(0, 255, 157, 0.2);
        }

        #start-match-btn {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: var(--text-dark);
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 12px;
            margin-top: 25px;
            cursor: pointer;
            border: none;
            transition: transform 0.2s;
        }
        #start-match-btn:disabled {
            background: #555;
            color: #888;
            cursor: not-allowed;
        }
        #start-match-btn:not(:disabled):hover {
            transform: scale(1.03);
        }

        /* Match Screen */
        #match-screen {
            display: none; /* Initially hidden */
            width: 100%;
        }

        #h2h-stats {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 20px;
            height: 25px;
        }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            gap: 20px;
            margin-bottom: 30px;
        }

        .player-card {
            background-color: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            width: 45%;
            border: 2px solid #444;
        }
        
        .player-card-name { font-size: 1.4rem; font-weight: 700; margin-bottom: 15px; }
        .score { font-size: 4rem; font-weight: 900; margin-bottom: 20px; }
        
        .add-win-btn {
            background: var(--primary);
            color: var(--text-dark);
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            border: none;
        }

        #end-match-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 30px;
            font-size: 1rem;
            cursor: pointer;
        }

        /* Match History */
        #history-log {
            margin-top: 40px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
        }
        #history-log ul { list-style: none; padding: 0; margin: 0; max-height: 200px; overflow-y: auto; }
        #history-log li {
            background: var(--bg-light);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
        }
        #history-log li .date { font-size: 0.8rem; color: #aaa; }

        /* Modal */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); align-items: center; justify-content: center; }
        .modal-content { background-color: var(--card-bg); padding: 30px; border-radius: 15px; text-align: center; width: 80%; max-width: 400px; border: 1px solid var(--primary); }
        .modal-buttons { margin-top: 25px; display: flex; justify-content: space-around; }
        .modal-btn { padding: 10px 25px; border-radius: 8px; border: none; font-size: 1rem; font-weight: bold; cursor: pointer; }
        #confirm-win { background-color: var(--primary); color: var(--text-dark); }
        #cancel-win { background-color: #6c757d; color: white; }
    </style>
</head>
<body>

    <div class="container">
        <h1>سِجِل الأبطال PRO</h1>

        <!-- Player Setup -->
        <div id="player-setup">
            <h2>إعدادات اللاعبين</h2>
            <div class="player-inputs">
                <div class="player-input-group">
                    <span class="total-wins" id="p1_wins_display">👑 0</span>
                    <input type="text" id="p1_name" class="player-name-input" data-player="p1" value="اللاعب 1">
                </div>
                <div class="player-input-group">
                    <span class="total-wins" id="p2_wins_display">0</span>
                    <input type="text" id="p2_name" class="player-name-input" data-player="p2" value="اللاعب 2">
                </div>
                <div class="player-input-group">
                    <span class="total-wins" id="p3_wins_display">0</span>
                    <input type="text" id="p3_name" class="player-name-input" data-player="p3" value="اللاعب 3">
                </div>
            </div>
        </div>

        <!-- Screens will be swapped here -->
        <div id="main-content">
            <!-- Match Selection -->
            <div id="match-selection">
                <h2>اختر المتنافسين</h2>
                <div class="player-selection-grid">
                    <div class="player-select-card" data-player="p1" id="p1_select_card">اللاعب 1</div>
                    <div class="player-select-card" data-player="p2" id="p2_select_card">اللاعب 2</div>
                    <div class="player-select-card" data-player="p3" id="p3_select_card">اللاعب 3</div>
                </div>
                <button id="start-match-btn" disabled>بدء المباراة</button>
            </div>

            <!-- Match Screen -->
            <div id="match-screen">
                <h2 id="h2h-stats"></h2>
                <div class="scoreboard">
                    <div class="player-card" id="match_p1_card">
                        <div class="player-card-name" id="match_p1_name"></div>
                        <div class="score" id="match_p1_score">0</div>
                        <button class="add-win-btn" id="match_p1_win_btn">أضف فوز</button>
                    </div>
                    <div class="player-card" id="match_p2_card">
                        <div class="player-card-name" id="match_p2_name"></div>
                        <div class="score" id="match_p2_score">0</div>
                        <button class="add-win-btn" id="match_p2_win_btn">أضف فوز</button>
                    </div>
                </div>
                <button id="end-match-btn">إنهاء المباراة والعودة</button>
            </div>
        </div>
        
        <!-- Match History -->
        <div id="history-log">
            <h2><span class="crown">📜</span> سجل المباريات</h2>
            <ul id="history-list">
                <!-- History items will be injected here -->
            </ul>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmation-modal" class="modal">
        <div class="modal-content">
            <p id="confirmation-message"></p>
            <div class="modal-buttons">
                <button id="confirm-win" class="modal-btn">تأكيد الفوز</button>
                <button id="cancel-win" class="modal-btn">إلغاء</button>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // State
            let state = {
                players: {
                    p1: { name: 'اللاعب 1', wins: 0 },
                    p2: { name: 'اللاعب 2', wins: 0 },
                    p3: { name: 'اللاعب 3', wins: 0 },
                },
                matchHistory: [],
                selectedPlayers: [],
                currentMatch: {
                    p1: null, p2: null, p1_score: 0, p2_score: 0
                }
            };
            let playerToConfirm = null;

            // DOM Elements
            const nameInputs = document.querySelectorAll('.player-name-input');
            const selectionCards = document.querySelectorAll('.player-select-card');
            const startMatchBtn = document.getElementById('start-match-btn');
            const matchSelectionScreen = document.getElementById('match-selection');
            const matchScreen = document.getElementById('match-screen');
            const endMatchBtn = document.getElementById('end-match-btn');
            const historyList = document.getElementById('history-list');
            const h2hStatsEl = document.getElementById('h2h-stats');
            
            // Modal Elements
            const modal = document.getElementById('confirmation-modal');
            const confirmMsg = document.getElementById('confirmation-message');
            const confirmBtn = document.getElementById('confirm-win');
            const cancelBtn = document.getElementById('cancel-win');

            // --- Main Functions ---
            function saveState() {
                localStorage.setItem('fcProTrackerState', JSON.stringify(state));
            }

            function loadState() {
                const savedState = localStorage.getItem('fcProTrackerState');
                if (savedState) {
                    state = JSON.parse(savedState);
                }
                // Reset transient state
                state.selectedPlayers = [];
                state.currentMatch = { p1: null, p2: null, p1_score: 0, p2_score: 0 };
            }

            function updateUI() {
                // Update player setup names and wins
                let maxWins = -1;
                let king = null;
                for (const pKey in state.players) {
                    document.getElementById(`${pKey}_name`).value = state.players[pKey].name;
                    document.getElementById(`${pKey}_wins_display`).innerHTML = `${state.players[pKey].wins}`;
                    document.getElementById(`${pKey}_select_card`).textContent = state.players[pKey].name;
                    if(state.players[pKey].wins > maxWins) {
                        maxWins = state.players[pKey].wins;
                        king = pKey;
                    }
                }
                
                // Update king of the hill
                document.querySelectorAll('.total-wins').forEach(el => {
                   el.innerHTML = el.innerHTML.replace('👑 ', '');
                });
                if(king && maxWins > 0) {
                     document.getElementById(`${king}_wins_display`).innerHTML = '👑 ' + document.getElementById(`${king}_wins_display`).innerHTML;
                }


                // Update selection cards UI
                selectionCards.forEach(card => {
                    const pKey = card.dataset.player;
                    if (state.selectedPlayers.includes(pKey)) {
                        card.classList.add('selected');
                    } else {
                        card.classList.remove('selected');
                    }
                });
                startMatchBtn.disabled = state.selectedPlayers.length !== 2;

                // Update match history
                historyList.innerHTML = '';
                [...state.matchHistory].reverse().forEach(match => {
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <span><strong>${state.players[match.winner].name}</strong> هزم <strong>${state.players[match.loser].name}</strong></span>
                        <span class="date">${new Date(match.date).toLocaleDateString('ar-EG')}</span>
                    `;
                    historyList.appendChild(li);
                });
                
                // Show correct screen
                if (state.currentMatch.p1) {
                    matchSelectionScreen.style.display = 'none';
                    matchScreen.style.display = 'block';
                    updateMatchScreenUI();
                } else {
                    matchSelectionScreen.style.display = 'block';
                    matchScreen.style.display = 'none';
                }
            }

            function updateMatchScreenUI() {
                const [p1_key, p2_key] = state.currentMatch.p1 < state.currentMatch.p2 ? [state.currentMatch.p1, state.currentMatch.p2] : [state.currentMatch.p2, state.currentMatch.p1];

                document.getElementById('match_p1_name').textContent = state.players[p1_key].name;
                document.getElementById('match_p2_name').textContent = state.players[p2_key].name;
                
                document.getElementById('match_p1_score').textContent = state.currentMatch.p1_score;
                document.getElementById('match_p2_score').textContent = state.currentMatch.p2_score;

                document.getElementById('match_p1_win_btn').dataset.player = p1_key;
                document.getElementById('match_p2_win_btn').dataset.player = p2_key;
                
                // H2H stats
                let p1_h2h_wins = 0;
                let p2_h2h_wins = 0;
                state.matchHistory.forEach(match => {
                    if (match.winner === p1_key && match.loser === p2_key) p1_h2h_wins++;
                    if (match.winner === p2_key && match.loser === p1_key) p2_h2h_wins++;
                });
                h2hStatsEl.textContent = `المواجهات المباشرة: ${p1_h2h_wins} - ${p2_h2h_wins}`;
            }

            // --- Event Listeners ---
            nameInputs.forEach(input => {
                input.addEventListener('input', () => {
                    const pKey = input.dataset.player;
                    state.players[pKey].name = input.value;
                    saveState();
                    updateUI(); // To update select cards text
                });
            });

            selectionCards.forEach(card => {
                card.addEventListener('click', () => {
                    const pKey = card.dataset.player;
                    const index = state.selectedPlayers.indexOf(pKey);
                    if (index > -1) {
                        state.selectedPlayers.splice(index, 1);
                    } else {
                        if (state.selectedPlayers.length < 2) {
                            state.selectedPlayers.push(pKey);
                        }
                    }
                    updateUI();
                });
            });

            startMatchBtn.addEventListener('click', () => {
                if (state.selectedPlayers.length === 2) {
                    state.currentMatch.p1 = state.selectedPlayers[0];
                    state.currentMatch.p2 = state.selectedPlayers[1];
                    state.currentMatch.p1_score = 0;
                    state.currentMatch.p2_score = 0;
                    updateUI();
                }
            });

            endMatchBtn.addEventListener('click', () => {
                state.currentMatch.p1 = null;
                state.currentMatch.p2 = null;
                state.selectedPlayers = [];
                updateUI();
            });

            document.querySelectorAll('.add-win-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const winnerKey = e.target.dataset.player;
                    const loserKey = (winnerKey === state.currentMatch.p1) ? state.currentMatch.p2 : state.currentMatch.p1;
                    playerToConfirm = { winner: winnerKey, loser: loserKey };
                    
                    confirmMsg.textContent = `يا ${state.players[loserKey].name}، هل تؤكد فوز ${state.players[winnerKey].name}؟`;
                    modal.style.display = 'flex';
                });
            });

            confirmBtn.addEventListener('click', () => {
                if(playerToConfirm) {
                    // Update overall wins
                    state.players[playerToConfirm.winner].wins++;
                    
                    // Add to match history
                    state.matchHistory.push({
                        winner: playerToConfirm.winner,
                        loser: playerToConfirm.loser,
                        date: new Date().toISOString()
                    });

                    // Update current match score (for fun, doesn't persist)
                    if (playerToConfirm.winner === document.getElementById('match_p1_win_btn').dataset.player) {
                        state.currentMatch.p1_score++;
                    } else {
                        state.currentMatch.p2_score++;
                    }
                    
                    playerToConfirm = null;
                    modal.style.display = 'none';
                    saveState();
                    updateUI();
                }
            });

            cancelBtn.addEventListener('click', () => {
                playerToConfirm = null;
                modal.style.display = 'none';
            });

            // Initial Load
            loadState();
            updateUI();
        });
    </script>
</body>
</html>
