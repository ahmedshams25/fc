<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClientChat - Pro Dashboard & Firebase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap');
        body { font-family: 'IBM Plex Sans Arabic', sans-serif; background-color: #F8F9FE; overflow: hidden; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #E5E7EB; border-radius: 10px; }
        .project-view { display: none; }
        .project-view.active { display: block; }
        #auth-screen { display: flex; }
        #app-screen { display: none; }
        
        @media (max-width: 1024px) {
            aside { position: fixed; right: -100%; top: 0; height: 100%; transition: 0.3s; z-index: 50; }
            aside.open { right: 0; }
            .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 40; }
            .overlay.active { display: block; }
        }
    </style>
</head>
<body class="text-right">

    <!-- شاشة تسجيل الدخول -->
    <div id="auth-screen" class="fixed inset-0 bg-indigo-600 z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[32px] p-8 shadow-2xl">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4">
                    <i class="fas fa-comment-dots"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-800">مرحباً بك في ClientChat</h2>
                <p class="text-gray-400 text-sm mt-2">سجل دخولك لإدارة مشاريعك باحترافية</p>
            </div>
            <div class="space-y-4">
                <input type="email" id="auth-email" placeholder="البريد الإلكتروني" class="w-full p-4 bg-gray-50 border-none rounded-2xl outline-none focus:ring-2 focus:ring-indigo-400 transition">
                <input type="password" id="auth-pass" placeholder="كلمة المرور" class="w-full p-4 bg-gray-50 border-none rounded-2xl outline-none focus:ring-2 focus:ring-indigo-400 transition">
                <button onclick="handleAuth('login')" id="login-btn" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg hover:bg-indigo-700 transition">تسجيل الدخول</button>
                <button onclick="handleAuth('signup')" class="w-full text-indigo-600 text-sm font-bold mt-2">إنشاء حساب جديد؟</button>
            </div>
            <p id="auth-error" class="text-red-500 text-xs text-center mt-4 hidden"></p>
        </div>
    </div>

    <!-- واجهة التطبيق الرئيسية -->
    <div id="app-screen" class="flex h-screen w-full">
        <div id="sidebar-overlay" class="overlay" onclick="toggleSidebar()"></div>

        <aside id="main-sidebar" class="w-64 bg-white border-l border-gray-200 flex flex-col p-4">
            <div class="flex items-center justify-between mb-10 px-2">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white"><i class="fas fa-comment-dots"></i></div>
                    <span class="text-xl font-bold">ClientChat</span>
                </div>
                <button onclick="toggleSidebar()" class="lg:hidden text-gray-400"><i class="fas fa-times text-xl"></i></button>
            </div>
            
            <nav class="flex-1 space-y-2 overflow-y-auto custom-scrollbar">
                <a href="javascript:void(0)" onclick="showView('projects-list')" class="flex items-center gap-3 p-3 text-sm font-medium text-gray-500 hover:bg-gray-50 rounded-xl transition"><i class="fas fa-th-large w-5"></i> لوحة التحكم</a>
                <div class="pt-6">
                    <div class="flex justify-between items-center px-3 mb-2">
                        <p class="text-[10px] uppercase font-bold text-gray-400">مشاريعك</p>
                        <button onclick="createNewProject()" class="text-indigo-600 hover:text-indigo-800 text-xs"><i class="fas fa-plus-circle"></i></button>
                    </div>
                    <div id="sidebar-projects-list" class="space-y-1"></div>
                </div>
            </nav>

            <button onclick="logout()" class="mt-auto flex items-center gap-3 p-3 text-sm font-medium text-red-500 hover:bg-red-50 rounded-xl transition">
                <i class="fas fa-sign-out-alt w-5"></i> تسجيل الخروج
            </button>
        </aside>

        <main class="flex-1 overflow-y-auto relative h-full custom-scrollbar">
            <div class="lg:hidden p-4 bg-white border-b flex items-center justify-between sticky top-0 z-30">
                <button onclick="toggleSidebar()" class="text-indigo-600 p-2"><i class="fas fa-bars text-xl"></i></button>
                <span class="font-bold">لوحة التحكم</span>
                <div class="w-8"></div>
            </div>

            <div class="p-4 lg:p-8">
                <!-- عرض قائمة المشاريع -->
                <section id="view-projects-list" class="project-view active space-y-6">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
                        <h2 class="text-2xl font-bold">المشاريع</h2>
                        <button onclick="createNewProject()" class="w-full sm:w-auto bg-indigo-600 text-white px-6 py-3 rounded-xl flex items-center justify-center gap-2 font-medium shadow-lg shadow-indigo-100"><i class="fas fa-plus"></i> مشروع جديد</button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="projects-grid"></div>
                </section>

                <!-- عرض تفاصيل المشروع -->
                <section id="view-project-detail" class="project-view space-y-8">
                    <header class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-6">
                        <div>
                            <h1 class="text-2xl font-bold flex items-center gap-2"><span id="detail-title">--</span> <i class="fas fa-pen text-sm text-gray-300 cursor-pointer hover:text-indigo-600" onclick="editProjectData()"></i></h1>
                            <p class="text-sm text-gray-400 mt-1">العميل: <span id="detail-client" class="text-gray-600 font-medium">--</span> <span class="mx-2">|</span> الموعد: <span id="detail-deadline" class="text-indigo-600">--</span></p>
                        </div>
                        <div class="flex items-center gap-4 w-full lg:w-auto">
                            <div class="bg-white px-4 py-2 border rounded-xl shadow-sm text-left flex-1 lg:flex-none">
                                <p class="text-[10px] text-gray-400">الميزانية</p>
                                <p class="text-sm font-bold text-green-600" id="detail-cost">--</p>
                            </div>
                            <button onclick="showView('projects-list')" class="bg-gray-100 text-gray-600 px-6 py-2 rounded-xl font-medium hover:bg-gray-200 transition">خروج</button>
                        </div>
                    </header>

                    <div class="grid grid-cols-12 gap-6">
                        <div class="col-span-12 lg:col-span-3 h-[500px] lg:h-[650px]">
                            <div class="bg-white rounded-3xl p-5 border h-full flex flex-col shadow-sm">
                                <h3 class="font-bold mb-4 flex justify-between">1. Conversation <i class="fab fa-whatsapp text-green-500"></i></h3>
                                <div id="detail-chat" class="flex-1 overflow-y-auto custom-scrollbar space-y-4 px-1 mb-4"></div>
                                <div class="flex gap-2">
                                    <input type="text" id="chat-input" placeholder="اكتب..." class="flex-1 bg-gray-50 border-none rounded-xl p-3 text-sm outline-none">
                                    <button onclick="addMessage()" class="bg-indigo-600 text-white p-3 rounded-xl"><i class="fas fa-paper-plane"></i></button>
                                </div>
                            </div>
                        </div>

                        <div class="col-span-12 lg:col-span-6 space-y-6">
                            <div class="bg-white rounded-[32px] p-6 border shadow-sm">
                                <h3 class="font-bold mb-4 text-gray-400 text-xs uppercase">2. Project Summary</h3>
                                <div class="bg-gray-50 rounded-2xl p-5 mb-6 text-sm text-gray-600" id="detail-desc">--</div>
                                <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6" id="project-stats-grid">
                                    <!-- Stats here -->
                                </div>
                                <div class="flex justify-between items-center mb-4 pt-4 border-t border-gray-50">
                                    <h4 class="text-sm font-bold">ملاحظات العميل</h4>
                                    <button onclick="addClientNote()" class="text-xs text-indigo-600 font-bold">+ إضافة</button>
                                </div>
                                <div id="detail-notes-list" class="space-y-2"></div>
                            </div>
                        </div>

                        <div class="col-span-12 lg:col-span-3 space-y-6">
                            <div id="archive-section" class="bg-indigo-600 rounded-3xl p-6 text-white text-center shadow-lg transition-all duration-500">
                                <i id="archive-icon" class="fas fa-rocket text-2xl mb-4 opacity-50"></i>
                                <p id="archive-title" class="text-xs font-bold mb-2">هل اكتمل المشروع؟</p>
                                <button id="archive-btn" onclick="archiveProject()" class="bg-white text-indigo-600 text-[10px] font-bold py-2 px-6 rounded-xl w-full shadow-sm transition hover:scale-105">أرشفة المشروع</button>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBTIMg3VoLM96vSWk0WktbWhZnqhvsEeJM",
            authDomain: "projects-1b2f4.firebaseapp.com",
            projectId: "projects-1b2f4",
            storageBucket: "projects-1b2f4.firebasestorage.app",
            messagingSenderId: "832971856969",
            appId: "1:832971856969:web:a55f4e4736a345f6d93398",
            measurementId: "G-V0Z0DY55Q7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let projects = [];
        let currentId = null;

        // --- Auth Logic ---
        window.handleAuth = async (type) => {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-pass').value;
            const errEl = document.getElementById('auth-error');
            
            try {
                if (type === 'login') await signInWithEmailAndPassword(auth, email, pass);
                else await createUserWithEmailAndPassword(auth, email, pass);
                errEl.classList.add('hidden');
            } catch (error) {
                errEl.innerText = "خطأ: " + error.message;
                errEl.classList.remove('hidden');
            }
        };

        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'flex';
                listenToProjects();
            } else {
                currentUser = null;
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('app-screen').style.display = 'none';
            }
        });

        // --- Database Logic ---
        function listenToProjects() {
            const q = query(collection(db, "projects"), where("userId", "==", currentUser.uid));
            onSnapshot(q, (snapshot) => {
                projects = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderProjects();
                if (currentId) {
                    const p = projects.find(x => x.id === currentId);
                    if (p) updateUI(p);
                }
            });
        }

        window.createNewProject = async () => {
            const title = prompt("اسم المشروع:");
            if (!title) return;
            const newProj = {
                title, userId: currentUser.uid, client: 'عميل جديد', 
                desc: 'نبذة عن المشروع...', cost: '$0', deadline: '2026-05-20',
                isArchived: false, chat: [], notes: [], timestamp: Date.now()
            };
            await setDoc(doc(collection(db, "projects")), newProj);
        };

        window.openProject = (id) => {
            currentId = id;
            const p = projects.find(x => x.id === id);
            updateUI(p);
            showView('project-detail');
        };

        function updateUI(p) {
            document.getElementById('detail-title').innerText = p.title;
            document.getElementById('detail-client').innerText = p.client;
            document.getElementById('detail-cost').innerText = p.cost;
            document.getElementById('detail-desc').innerText = p.desc;
            document.getElementById('detail-deadline').innerText = p.deadline;
            
            // Render Chat
            document.getElementById('detail-chat').innerHTML = p.chat.map(m => `
                <div class="bg-indigo-50 p-3 rounded-2xl rounded-tr-none ml-auto max-w-[90%] shadow-sm">
                    <p class="text-xs text-gray-700">${m.text}</p>
                    <span class="text-[9px] text-indigo-300 block mt-1">${m.time}</span>
                </div>
            `).join('');

            // Render Notes
            document.getElementById('detail-notes-list').innerHTML = p.notes.map((n, i) => `
                <div class="bg-orange-50 p-3 rounded-xl text-[11px] flex justify-between items-center text-orange-700">
                    <span>${n}</span>
                </div>
            `).join('');

            // Reset Archive
            const arcSect = document.getElementById('archive-section');
            if (p.isArchived) {
                arcSect.classList.replace('bg-indigo-600', 'bg-green-500');
                document.getElementById('archive-btn').innerText = "مؤرشف بنجاح";
            } else {
                arcSect.classList.replace('bg-green-500', 'bg-indigo-600');
                document.getElementById('archive-btn').innerText = "أرشفة المشروع";
            }
        }

        window.addMessage = async () => {
            const inp = document.getElementById('chat-input');
            if (!inp.value) return;
            const p = projects.find(x => x.id === currentId);
            const newChat = [...p.chat, { text: inp.value, time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) }];
            await updateDoc(doc(db, "projects", currentId), { chat: newChat });
            inp.value = '';
        };

        window.archiveProject = async () => {
            await updateDoc(doc(db, "projects", currentId), { isArchived: true });
        };

        window.renderProjects = () => {
            const grid = document.getElementById('projects-grid');
            const side = document.getElementById('sidebar-projects-list');
            grid.innerHTML = side.innerHTML = '';
            projects.forEach(p => {
                grid.innerHTML += `
                    <div onclick="openProject('${p.id}')" class="bg-white p-6 rounded-[32px] border ${p.isArchived ? 'border-green-200' : 'border-gray-100'} shadow-sm cursor-pointer hover:scale-[1.02] transition">
                        <h4 class="font-bold">${p.title}</h4>
                        <p class="text-[10px] text-gray-400">${p.client}</p>
                    </div>`;
                side.innerHTML += `<button onclick="openProject('${p.id}')" class="w-full text-right p-3 text-xs text-gray-500 hover:bg-gray-50 rounded-xl">${p.title}</button>`;
            });
        };

        window.showView = (v) => {
            document.querySelectorAll('.project-view').forEach(el => el.classList.remove('active'));
            document.getElementById('view-' + v).classList.add('active');
        };

        window.toggleSidebar = () => {
            document.getElementById('main-sidebar').classList.toggle('open');
            document.getElementById('sidebar-overlay').classList.toggle('active');
        };
    </script>
</body>
</html>
