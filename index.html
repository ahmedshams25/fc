<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC Mobile Tracker</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');

        :root {
            --bg-color: #1a1a2e;
            --card-bg: #2a2a3e;
            --primary-green: #00ff87;
            --secondary-blue: #00bfff;
            --text-color: #f0f0f0;
            --shadow-color: rgba(0, 255, 135, 0.2);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            color: var(--primary-green);
            text-shadow: 0 0 10px var(--shadow-color);
            margin-bottom: 30px;
        }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            gap: 20px;
            margin-bottom: 30px;
        }

        .player-card {
            background-color: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            width: 45%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border: 2px solid #444;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .player-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px var(--shadow-color);
        }

        .player-name {
            background-color: transparent;
            border: none;
            border-bottom: 2px solid var(--secondary-blue);
            color: var(--text-color);
            font-size: 1.2rem;
            text-align: center;
            width: 100%;
            padding: 5px;
            margin-bottom: 20px;
        }
        .player-name:focus {
            outline: none;
            border-bottom-color: var(--primary-green);
        }

        .score {
            font-size: 4rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 20px;
            text-shadow: 0 0 15px var(--shadow-color);
        }

        .add-win-btn {
            background: linear-gradient(45deg, var(--primary-green), var(--secondary-blue));
            color: var(--bg-color);
            border: none;
            border-radius: 10px;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .add-win-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--shadow-color);
        }

        #reset-btn {
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px 30px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.3s;
        }
        #reset-btn:hover {
            background-color: #e04050;
        }
        
        /* Confirmation Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            width: 80%;
            max-width: 400px;
            box-shadow: 0 0 25px rgba(0,0,0,0.5);
            border: 1px solid var(--primary-green);
        }

        .modal-buttons {
            margin-top: 25px;
            display: flex;
            justify-content: space-around;
        }

        .modal-btn {
            padding: 10px 25px;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        #confirm-win {
            background-color: var(--primary-green);
            color: var(--bg-color);
        }

        #cancel-win {
            background-color: #6c757d;
            color: white;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>سِجِل الأبطال</h1>
        <div class="scoreboard">
            <div class="player-card" id="player1-card">
                <input type="text" class="player-name" id="player1-name" placeholder="اسم اللاعب 1" value="اللاعب 1">
                <div class="score" id="player1-score">0</div>
                <button class="add-win-btn" data-player="1">أضف فوز</button>
            </div>
            <div class="player-card" id="player2-card">
                <input type="text" class="player-name" id="player2-name" placeholder="اسم اللاعب 2" value="اللاعب 2">
                <div class="score" id="player2-score">0</div>
                <button class="add-win-btn" data-player="2">أضف فوز</button>
            </div>
        </div>
        <button id="reset-btn">بدء تحدي جديد</button>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmation-modal" class="modal">
        <div class="modal-content">
            <p id="confirmation-message"></p>
            <div class="modal-buttons">
                <button id="confirm-win" class="modal-btn">تأكيد الفوز</button>
                <button id="cancel-win" class="modal-btn">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const player1ScoreEl = document.getElementById('player1-score');
            const player2ScoreEl = document.getElementById('player2-score');
            const player1NameEl = document.getElementById('player1-name');
            const player2NameEl = document.getElementById('player2-name');
            const addWinButtons = document.querySelectorAll('.add-win-btn');
            const resetBtn = document.getElementById('reset-btn');

            const modal = document.getElementById('confirmation-modal');
            const confirmMsg = document.getElementById('confirmation-message');
            const confirmBtn = document.getElementById('confirm-win');
            const cancelBtn = document.getElementById('cancel-win');

            let scores = { player1: 0, player2: 0 };
            let names = { player1: 'اللاعب 1', player2: 'اللاعب 2' };
            let playerToUpdate = null;

            // Load from localStorage
            function loadState() {
                const savedScores = localStorage.getItem('fcScores');
                const savedNames = localStorage.getItem('fcNames');
                if (savedScores) {
                    scores = JSON.parse(savedScores);
                }
                if (savedNames) {
                    names = JSON.parse(savedNames);
                }
                updateUI();
            }

            // Save to localStorage
            function saveState() {
                localStorage.setItem('fcScores', JSON.stringify(scores));
                localStorage.setItem('fcNames', JSON.stringify(names));
            }

            // Update UI
            function updateUI() {
                player1ScoreEl.textContent = scores.player1;
                player2ScoreEl.textContent = scores.player2;
                player1NameEl.value = names.player1;
                player2NameEl.value = names.player2;
            }

            function showConfirmation(playerNumber) {
                playerToUpdate = playerNumber;
                const winnerName = (playerNumber === 1) ? names.player1 : names.player2;
                const opponentName = (playerNumber === 1) ? names.player2 : names.player1;
                confirmMsg.textContent = `يا ${opponentName}، هل تؤكد فوز ${winnerName}؟`;
                modal.style.display = 'flex';
            }

            addWinButtons.forEach(button => {
                button.addEventListener('click', (e) => {
                    const playerNumber = parseInt(e.target.dataset.player);
                    showConfirmation(playerNumber);
                });
            });

            confirmBtn.addEventListener('click', () => {
                if (playerToUpdate === 1) {
                    scores.player1++;
                } else if (playerToUpdate === 2) {
                    scores.player2++;
                }
                saveState();
                updateUI();
                modal.style.display = 'none';
            });
            
            cancelBtn.addEventListener('click', () => {
                modal.style.display = 'none';
                playerToUpdate = null;
            });

            resetBtn.addEventListener('click', () => {
                const confirmed = confirm('هل أنت متأكد أنك تريد تصفير النتائج والبدء من جديد؟');
                if (confirmed) {
                    scores = { player1: 0, player2: 0 };
                    saveState();
                    updateUI();
                }
            });

            player1NameEl.addEventListener('input', () => {
                names.player1 = player1NameEl.value;
                saveState();
            });

            player2NameEl.addEventListener('input', () => {
                names.player2 = player2NameEl.value;
                saveState();
            });
            
            // Initial load
            loadState();
        });
    </script>
</body>
</html>
